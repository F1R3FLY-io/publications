[package]
name = "serbench"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3.3"
blake2 = "0.11.0"
bytes = "1.12.1"
capnp = "0.27.2"
lz4_flex = "0.14.0"
prost = "0.14"
serde = { version = "1.0.229", features = ["derive"] }

[build-dependencies]
capnpc = "0.27.0"
prost-build = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
