[package]
name = "rho-weighted"
version = "0.3.1"
edition = "2021"
rust-version = "1.75"
publish = false
description = "Weighted graph-structured lambda theories: a simulator for stochastic and quantum execution of rho theories"
readme = "README.md"
keywords = ["gslt", "rho-calculus", "gillespie", "lindblad", "simulation"]
categories = ["science", "simulation"]

# Deliberately dependency-free: a study's numbers must not move when a
# dependency bumps its algorithm, and the crate must never be able to pull
# anything onto the consensus path. See DESIGN.md §3.
[dependencies]

[features]
default = []

# The complex codomain: jump operators, the Lindbladian, and the quantum-jump
# unravelling. Off by default because it is only meaningful for models that are
# finite in BOTH components of a configuration (note, Remark 34).
quantum = []

# Only satisfiable inside the f1r3node-rust workspace: swaps SimpleMatcher for
# an adapter over the interpreter's own `Matcher::get`. See DESIGN.md §6.
workspace-matcher = []

[[bin]]
name = "rho-sim"
path = "src/bin/rho-sim.rs"

[[example]]
name = "verify-claims"
required-features = ["quantum"]

[profile.test]
# The statistical suites run 10^5 trajectories; debug-mode arithmetic makes
# them minutes rather than seconds.
opt-level = 2
