name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo build --all-targets --features quantum
      - run: cargo clippy --all-targets --features quantum -- -D warnings
      - run: cargo test
      - run: cargo test --features quantum
      # The simulator must never be reachable from the consensus path.
      # Inside f1r3node-rust this becomes a check on `node` and `casper`.
      - name: no dependencies
        run: test "$(cargo tree --prefix none | grep -vc '^rho-weighted')" -eq 0
